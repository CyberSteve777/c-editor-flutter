name: c_editor
description: "Level Editor for Plants vs. Zombies 2 Chinese"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 0.1.0

environment:
  sdk: ^3.12.0
  # Floor from pubspec.lock / current deps (Dart 3.12 ⇒ Flutter 3.44).
  # itemExtentBuilder is older; keep CI/docs in sync when raising this.
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_bloc: ^9.1.1
  bloc: ^9.0.0
  share_plus: ^10.1.4
  equatable: ^2.0.7
  collection: ^1.18.0
  convert: ^3.1.2
  crypto: ^3.0.3
  shared_preferences: ^2.2.2
  path_provider: ^2.1.1
  file_picker: ^11.0.2
  path: ^1.8.3
  permission_handler: ^11.3.1
  archive: ^4.0.2
  package_info_plus: ^8.1.2
  url_launcher: ^6.3.1
  rijndael: ^1.0.1
  accessing_security_scoped_resource: ^3.5.0
  flutter_layout_grid: ^2.0.8
  country_flags: ^4.1.2
  idb_shim: ^2.9.2
  web: ^1.1.1
  drag_and_drop_lists: ^0.4.2
  flutter_eval:
    path: third_party/flutter_eval
  dart_eval: ^0.8.5
  eval_annotation: ^0.8.1
  http: ^1.6.0
  pub_semver: ^2.2.0
  intl: ^0.20.2
  nice_downloader: ^1.3.1
  fs_shim: ^2.5.5
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/reference/template/
    - assets/meta/icon.png
    - assets/meta/links.json
    - assets/meta/properties.json
    - assets/reference/
    - assets/resources/
    - assets/l10n/resource_en.json
    - assets/l10n/resource_zh.json
    - assets/l10n/resource_ru.json
    - assets/images/
    - assets/images/plants/
    - assets/images/zombies/
    - assets/images/round_icons/
    - assets/images/tags/
    - assets/images/tags/plants/rarity/
    - assets/images/tags/plants/role/
    - assets/images/tags/attributes/
    - assets/images/tags/zombies/type/
    - assets/images/griditems/
    - assets/images/tools/
    - assets/images/others/
    - assets/images/dinos/
    - assets/images/ztalemate_perks/
    - assets/images/fishes/
    - assets/images/tunnels/
    - lib/bundled_plugins/level_preview_cplugin/manifest.json
    - lib/bundled_plugins/level_preview_cplugin/assets/icon.png
    - lib/bundled_plugins/level_preview_cplugin/assets/l10n/en.arb
    - lib/bundled_plugins/level_preview_cplugin/assets/l10n/ru.arb
    - lib/bundled_plugins/level_preview_cplugin/assets/l10n/zh.arb
    - lib/bundled_plugins/dynamic_fetch_cplugin/manifest.json
    - lib/bundled_plugins/dynamic_fetch_cplugin/assets/icon.png
    - lib/bundled_plugins/dynamic_fetch_cplugin/assets/l10n/en.arb
    - lib/bundled_plugins/dynamic_fetch_cplugin/assets/l10n/ru.arb
    - lib/bundled_plugins/dynamic_fetch_cplugin/assets/l10n/zh.arb

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/meta/icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/meta/icon.png"
    background_color: "#ffffff"
    theme_color: "#1976d2"
  windows:
    generate: true
    image_path: "assets/meta/icon.png"
  macos:
    generate: true
    image_path: "assets/meta/icon.png"
  linux:
    generate: true
    image_path: "assets/meta/icon.png"
