<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Level Editor for Plants vs. Zombies 2 Chinese">
  <!-- Do not lock pinch-zoom: iOS then reports tap coordinates that do not
       match the canvas, killing the bottom and trailing edge. Desktop-site
       mode ignores that restriction. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="C-Editor">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>C-Editor</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      overscroll-behavior: none;
      position: fixed;
      inset: 0;
      /* Match dark canvas so resize/paste layout gaps never flash white. */
      background-color: #121212;
    }

    /* Flutter web's invisible text-editing overlay can briefly paint opaque
       after large pastes; keep it transparent so it never shows as a bar. */
    .flt-text-editing,
    .flt-text-editing *,
    textarea.flt-text-editing,
    input.flt-text-editing,
    .transparentTextEditing {
      background: transparent !important;
      background-color: transparent !important;
      caret-color: transparent !important;
      color: transparent !important;
      outline: none !important;
      border: none !important;
      box-shadow: none !important;
    }
  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="mobile_web_input.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
