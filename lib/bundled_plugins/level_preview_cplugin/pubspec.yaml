# Documentary package metadata — mirrors plugin_example/hello_cplugin layout.
# This plugin is embedded under package:c_editor (lib/bundled_plugins/...) for
# in-process load. Do NOT add it as a path dependency of the root app (would
# create a circular dep with c_editor). Host imports use package:c_editor/... .
name: level_preview_cplugin
description: Bundled C-Editor Level Overview plugin (in-process; packable via eval_src)
publish_to: "none"
version: 1.0.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  # Host embeds this tree; external packs would path-depend on c_editor instead.
  # c_editor:
  #   path: ../../../

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
